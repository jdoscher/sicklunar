server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none'" always;
  location = /healthz { access_log off; return 200 "ok\n"; }
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /data/ { add_header Cache-Control "public, max-age=3600"; }
  location = /credits { return 301 /about#credits; }
  location / { try_files $uri $uri.html $uri/ =404; add_header Cache-Control "no-cache"; }
}
