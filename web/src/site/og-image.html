<!doctype html>
<!-- Source of /og-image.png (1200x630). To regenerate: copy into web/dist after a build (fix the hashed font names), open it at 1200x630 and take a screenshot. Not part of the site. -->
<html lang="en"><head><meta charset="utf-8"><title>og</title>
<style>
@font-face { font-family: "Saira"; src: url(/assets/saira-latin-wdth-normal-X2eA-qfZ.woff2) format("woff2"); font-weight: 100 900; font-stretch: 50% 125%; }
@font-face { font-family: "Atkinson"; src: url(/assets/atkinson-hyperlegible-next-latin-wght-normal-BcXVPD7q.woff2) format("woff2"); font-weight: 200 800; }
* { margin: 0; box-sizing: border-box; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #04060A; }

.lockup img { width: 72px; height: 72px; }
.word { font-size: 40px; letter-spacing: .14em; text-transform: uppercase; line-height: 1; }
.word .a { font-weight: 300; } .word .b { font-weight: 800; }
h1 { margin-top: auto; font-size: 92px; font-weight: 700; font-variation-settings: "wdth" 78; line-height: .98; letter-spacing: -.01em; }
.sub { margin-top: 30px; display: flex; align-items: center; gap: 22px; font-size: 20px; font-weight: 600; letter-spacing: .12em; white-space: nowrap; text-transform: uppercase; color: #B6BECA; }

<body><div class="card">
<img class="moon" src="/img/moon-hero-1100.webp" alt="">
<div class="copy">
  <div class="lockup"><img src="/brand/mark-1-sickle-onhull.svg" alt=""><div class="word"><span class="a">Sick</span><span class="b">lunar</span></div></div>

  <div class="sub"><span class="go">Plan a trip to the Moon</span><span>Free · No ads · No tracking</span></div>
</div>
<div class="url">sicklunar.com</div>
</div></body></html>
